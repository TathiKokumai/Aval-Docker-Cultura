services:
  banco-oficinas:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: prova123
      MARIADB_DATABASE: oficinas
      MARIADB_USER: sistema
      MARIADB_PASSWORD: sistema123
    volumes:
      - dados_oficinas:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - rede_oficinas

  aplicacao-oficinas:
    build: ./app
    environment:
      DB_HOST: banco-oficinas
      DB_USER: sistema
      DB_PASSWORD: sistema123
      DB_NAME: oficinas
    ports:
      - "3000:3000"
    depends_on:
      - banco-oficinas
    networks:
      - rede_oficinas

volumes:
  dados_oficinas:

networks:
  rede_oficinas:
